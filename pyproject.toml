[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-sidecar"
version = "0.6.0"
description = "Local sidecar giving any tool grounded, cited, routed AI — Ollama or OpenRouter, no API key required."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
    "llm", "ollama", "openrouter", "mcp", "model-context-protocol",
    "fact-checking", "rag", "local-first", "sidecar", "llm-router",
    "grounded-generation", "citations",
]
authors = [{ name = "Muhammad Awais Tahir" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

# Everything the `llm-sidecar` command needs, by default.
#
# An earlier version kept the core to httpx alone and put the daemon, search
# and MCP behind extras. That optimised for the library case at the expense of
# the primary one: `pip install llm-sidecar` produced a command whose main
# subcommands died with a raw ModuleNotFoundError. Six saved packages is not
# worth a broken first run.
dependencies = [
    "httpx>=0.28.0",
    "ddgs>=9.10.0",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
# Kept so existing instructions and lockfiles keep working. They are now
# no-ops: everything they used to add is installed by default.
search = []
daemon = []
mcp = []
all = []
dev = ["pytest", "openai", "build", "twine"]

[project.scripts]
llm-sidecar = "llm_sidecar.cli:main"

[project.urls]
Homepage = "https://github.com/awaistechnologist/llm-sidecar"
Repository = "https://github.com/awaistechnologist/llm-sidecar"
Issues = "https://github.com/awaistechnologist/llm-sidecar/issues"
Changelog = "https://github.com/awaistechnologist/llm-sidecar/releases"

[tool.hatch.build.targets.wheel]
packages = ["llm_sidecar"]
exclude = ["tests", "tests/*"]

[tool.hatch.build.targets.sdist]
# The sdist should be able to rebuild and re-verify itself, so it keeps the
# tests the wheel drops.
include = ["llm_sidecar", "README.md", "LICENSE", "pyproject.toml",
           "install.sh", "install.bat", "run.sh", "run.bat"]

[tool.pytest.ini_options]
testpaths = ["llm_sidecar/tests"]
