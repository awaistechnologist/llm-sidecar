// ── connection ──────────────────────────────────────────────────────────────

async function connect() {
  try {
    engines = await getJSON("/app/api/engines");
    online = true;
    $("d-ver").textContent = "v" + engines.version + " · " + location.host.split(".")[0];
    $("drawer-host").textContent = location.hostname === "localhost" || location.hostname === "127.0.0.1" ? "this computer" : location.hostname.split(".")[0];
    // A remembered engine that has since gone away (model removed, Claude
    // turned off) silently failing every message would be worse than
    // falling back to Auto and saying so.
    const e = settings.engine;
    if ((e.kind === "local" && !engines.local.includes(e.model)) ||
        (e.kind === "claude" && !engines.claude.includes(e.model)) ||
        (e.kind === "cloud" && !engines.cloud.configured)) {
      settings.engine = { kind: "auto" }; saveSettings();
      toast("That model isn't available any more — using Auto");
    }
    const img = engines.images || {};
    $("mode-image").hidden = !img.available;
    if (!img.available && settings.mode === "image") setMode("chat");
    renderImageOpts();
  } catch (err) {
    online = false;
  }
  renderEngine();
  if (!current?.messages.length) render();
}
setInterval(() => { if (document.visibilityState === "visible") connect(); }, 30000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") connect(); });

// ── markdown ────────────────────────────────────────────────────────────────
// Small and strict: escape everything first, then add back a known set of
// tags. Links are http(s) only. Good enough for model output, and nothing a
// model writes can become script.

function inline(s) {
  const codes = [];
  s = s.replace(/`([^`\n]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, t, u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`);
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+[^\s<).,;:!?'"])/g, (_, p, u) => `${p}<a href="${u}" target="_blank" rel="noopener noreferrer">${u.replace(/^https?:\/\/(www\.)?/, "").slice(0, 48)}</a>`);
  s = s.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>").replace(/__([^_\n]+)__/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, "$1<em>$2</em>").replace(/(^|[^_\w])_([^_\n]+)_(?!\w)/g, "$1<em>$2</em>");
  s = s.replace(/~~([^~\n]+)~~/g, "<del>$1</del>");
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[+i]}</code>`);
}

function markdown(src, streaming = false) {
  let think = "";
  // Reasoning models (deepseek-r1 and friends) wrap their chain of thought
  // in <think>. Folded away rather than shown as the answer.
  src = src.replace(/<think>([\s\S]*?)(<\/think>|$)/, (_, t, close) => { think = t.trim(); return close ? "" : ""; });
  const blocks = [];
  src = src.replace(/```([\w+-]*)[^\n]*\n([\s\S]*?)(```|$)/g, (_, lang, code) => {
    blocks.push({ lang, code: code.replace(/\n$/, "") });
    return "\n\u0001" + (blocks.length - 1) + "\u0001\n";
  });
  const lines = esc(src).split("\n");
  let out = "", i = 0;
  const para = [];
  const flush = () => { if (para.length) { out += "<p>" + inline(para.join("<br>")) + "</p>"; para.length = 0; } };
  while (i < lines.length) {
    const l = lines[i];
    let m;
    if ((m = l.match(/^\u0001(\d+)\u0001$/))) {
      flush(); const b = blocks[+m[1]];
      out += `<div class="codeblock"><div class="bar"><span>${esc(b.lang || "code")}</span><button data-copy="${+m[1]}">Copy</button></div><pre><code>${esc(b.code)}</code></pre></div>`;
      i++; continue;
    }
    if (!l.trim()) { flush(); i++; continue; }
    if ((m = l.match(/^(#{1,4})\s+(.*)$/))) { flush(); const n = Math.min(3, m[1].length); out += `<h${n}>${inline(m[2])}</h${n}>`; i++; continue; }
    if (/^\s*([-*_])\s*\1\s*\1[\s\1]*$/.test(l)) { flush(); out += "<hr>"; i++; continue; }
    if (/^&gt;\s?/.test(l)) {
      flush(); const q = [];
      while (i < lines.length && /^&gt;\s?/.test(lines[i])) q.push(lines[i++].replace(/^&gt;\s?/, ""));
      out += "<blockquote>" + inline(q.join("<br>")) + "</blockquote>"; continue;
    }
    if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
      flush();
      const cells = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => inline(c.trim()));
      const head = cells(l); i += 2;
      let t = "<div class='tbl'><table><thead><tr>" + head.map((c) => `<th>${c}</th>`).join("") + "</tr></thead><tbody>";
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) t += "<tr>" + cells(lines[i++]).map((c) => `<td>${c}</td>`).join("") + "</tr>";
      out += t + "</tbody></table></div>"; continue;
    }
    if ((m = l.match(/^(\s*)([-*+]|\d+[.)])\s+/))) {
      flush();
      const ordered = /\d/.test(m[2]);
      let list = ordered ? "<ol>" : "<ul>";
      while (i < lines.length && (m = lines[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/))) {
        let item = m[3]; i++;
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) item += "<br>" + lines[i++].trim();
        const nested = m[1].length >= 2;
        list += `<li${nested ? ' style="margin-left:1.1em"' : ""}>${inline(item)}</li>`;
      }
      out += list + (ordered ? "</ol>" : "</ul>"); continue;
    }
    para.push(l); i++;
  }
  flush();
  if (streaming) out = out.replace(/(<\/(p|li|h\d|code)>)(?![\s\S]*<\/(p|li|h\d|code)>)/, '<span class="caret"></span>$1') || out + '<span class="caret"></span>';
  const th = think ? `<details class="think"><summary>Thought it through</summary>${inline(esc(think)).replace(/\n/g, "<br>")}</details>` : "";
  return { html: th + out, blocks };
}

// ── rendering ───────────────────────────────────────────────────────────────

function receiptHTML(meta = {}) {
  if (!meta.model) return "";
  const id = meta.model;
  let tag;
  if (id.startsWith("claude/")) tag = `<span class="tag sub">subscription</span>`;
  else if (meta.local || id.startsWith("ollama/")) tag = `<span class="tag">on your Mac</span>`;
  else tag = `<span class="tag cloud">${meta.cost ? "$" + meta.cost.toFixed(meta.cost < 0.01 ? 4 : 3) : "free"}</span>`;
  const bits = [esc(pretty(id)), tag];
  if (meta.cached) bits.push("cached");
  if (meta.seconds != null) bits.push(meta.seconds.toFixed(1) + "s");
  return `<span class="receipt">${bits.join(" ")}</span>`;
}

function actionsHTML(m, last) {
  let a = "";
  if (m.kind !== "image" && m.kind !== "error") a += `<button class="act" data-act="copy" aria-label="Copy">${ICON.copy}</button>`;
  if (m.kind !== "error") a += `<button class="act" data-act="share" aria-label="Share">${ICON.share}</button>`;
  if (m.kind === "text" && canSpeak()) a += `<button class="act" data-act="speak" aria-label="Read aloud">${ICON.speak}</button>`;
  if (last) a += `<button class="act" data-act="again" aria-label="Try again">${ICON.again}</button>`;
  return a;
}

function hostOf(u) { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return u; } }
function pathOf(u) { try { const x = new URL(u); return decodeURIComponent(x.pathname + x.search).slice(0, 80); } catch { return ""; } }

function aiBody(m, streaming) {
  if (m.kind === "error") return `<div class="err">${esc(m.text)}</div>`;
  if (m.kind === "pending") return m.status ? `<div class="status-line"><span class="spinner"></span>${esc(m.status)}</div>` : `<div class="typing"><i></i><i></i><i></i></div>`;
  if (m.kind === "image") {
    if (!m.url) {
      const ar = m.ar || 1;
      return `<div class="imgcard pending" style="--ar:${ar}"><div class="pend"><b data-elapsed="${m.started}">0s</b>${esc(m.status || "Painting on your Mac")}<br><span style="font-size:12px">${m.expect ? "usually ~" + Math.round(m.expect) + "s" : ""}</span></div><div class="bar2" data-progress="${m.started}" data-expect="${m.expect || 30}" style="width:0"></div></div>`;
    }
    return `<div class="imgcard"><img src="${esc(imgSrc(m.url))}" alt="${esc(m.prompt)}" data-lb="${esc(m.url)}" data-prompt="${esc(m.prompt)}" loading="lazy"></div>`;
  }
  if (m.kind === "verdicts") {
    if (!m.results.length) return `<div class="body"><p>No checkable claims found in that.</p></div>`;
    return `<div class="verdicts">` + m.results.map((r) => `<div class="verdict"><div class="v ${esc(r.verdict)}">${esc(r.verdict.replace(/_/g, " "))}</div>${esc(r.claim)}${r.note ? `<div class="note">${esc(r.note)}</div>` : ""}</div>`).join("") + `</div>`;
  }
  let h = "";
  if (m.kind === "answer") {
    h += m.grounded ? `<div style="margin-bottom:6px"><span class="badge ok">${ICON.check2} From ${m.sources.length} source${m.sources.length === 1 ? "" : "s"}</span></div>`
                    : `<div style="margin-bottom:6px"><span class="badge warn">Sources didn't settle it</span></div>`;
  }
  h += `<div class="body">${markdown(m.text || "", streaming).html}</div>`;
  if (m.kind === "answer" && m.sources?.length) {
    h += `<div class="sources">` + m.sources.map((u, i) => `<a class="src" href="${esc(u)}" target="_blank" rel="noopener noreferrer"><span class="n">${i + 1}</span><span class="d">${esc(hostOf(u))}</span><span class="p">${esc(pathOf(u))}</span></a>`).join("") + `</div>`;
  }
  if (m.caveat) h += `<p class="note" style="margin:6px 0 0">${esc(m.caveat)}</p>`;
  return h;
}

function msgHTML(m, idx, lastAi) {
  if (m.role === "user") {
    return `<div class="msg user" data-i="${idx}">${m.ctx ? `<div class="ctx-chip">📎 ${esc(m.ctx.title || m.ctx.url || "attached text")}</div>` : ""}<div class="bubble-user">${esc(m.text)}</div></div>`;
  }
  const streaming = busy && idx === current.messages.length - 1 && m.kind === "text";
  const done = !streaming && m.kind !== "pending" && !(m.kind === "image" && !m.url);
  return `<div class="msg ai" data-i="${idx}">${aiBody(m, streaming)}${done ? `<div class="meta">${receiptHTML(m.meta)}${actionsHTML(m, lastAi)}</div>` : ""}</div>`;
}

function emptyHTML() {
  if (online === false) {
    return `<div class="offline"><div class="ic">${ICON.off}</div><h2>Can't reach your Mac</h2>
      <p>Check Tailscale is connected on this phone, and that the Mac is awake with the sidecar running.</p>
      <button class="btn primary" style="flex:none;padding:12px 26px" id="retry">Try again</button>
      ${convs.length ? `<p class="note" style="margin-top:22px">Your conversations are still here — open the menu.</p>` : ""}</div>`;
  }
  const img = engines?.images?.available;
  const local = engines?.local?.length;
  const tile = (mode, ic, t, s) => `<button class="tile" data-tile="${mode}"><span class="t-ic">${ic}</span><b>${t}</b><small>${s}</small></button>`;
  const appLink = !NATIVE && /Android/i.test(navigator.userAgent) && !matchMedia("(display-mode: standalone)").matches
    ? `<a class="app-link" href="llmsidecar://connect?url=${encodeURIComponent(location.origin)}">Use in the Android app →</a>` : "";
  return `<div class="hero">
    <div class="mark"><svg width="34" height="34" viewBox="0 0 24 24"><circle cx="10" cy="12" r="6" fill="#fff"/><circle cx="19.2" cy="12" r="3" fill="#fff" opacity=".75"/></svg></div>
    <h1>${greeting()}</h1>
    <p>Everything your Mac can reach — its own models, your Claude subscription, and the cloud — from here.</p>
    <div class="tiles">
      ${tile("chat", ICON.mac, "Talk privately", local ? local + " models on your Mac" : "on your Mac")}
      ${tile("web", ICON.web, "Ask the web", "Answers with sources")}
      ${img ? tile("image", ICON.image, "Make an image", "On your Mac's GPU") : ""}
      ${tile("share", ICON.share, "Share anything", "Links & text from any app")}
    </div>
    ${appLink}
  </div>`;
}
function greeting() {
  const h = new Date().getHours();
  return h < 5 ? "Up late?" : h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
}

let stickBottom = true;
function render() {
  // A streaming frame still queued would land after this and overwrite the
  // finished message with its mid-stream version.
  if (frame) { cancelAnimationFrame(frame); frame = 0; }
  const t = $("thread");
  if (!current || !current.messages.length) {
    t.innerHTML = emptyHTML();
    t.querySelector("#retry")?.addEventListener("click", () => { online = null; renderEngine(); connect(); });
    t.querySelectorAll("[data-tile]").forEach((b) => b.onclick = () => {
      const k = b.dataset.tile;
      if (k === "share") return toast(NATIVE ? "Use Share → Sidecar in any app" : "Install the app (⋮ → Install), then use Share → Sidecar");
      setMode(k); $("input").focus();
    });
    return;
  }
  const lastAi = current.messages.map((m) => m.role).lastIndexOf("assistant");
  t.innerHTML = current.messages.map((m, i) => msgHTML(m, i, i === lastAi && !busy)).join("");
  if (stickBottom) scrollToEnd();
}
// Streaming re-renders only the last message, once per frame.
let frame = 0;
function renderLast() {
  if (frame) return;
  frame = requestAnimationFrame(() => {
    frame = 0;
    const t = $("thread"), i = current.messages.length - 1;
    const el = t.querySelector(`.msg[data-i="${i}"]`);
    if (!el) return render();
    el.outerHTML = msgHTML(current.messages[i], i, false);
    if (stickBottom) scrollToEnd(false);
  });
}
function scrollToEnd(smooth = true) {
  const s = $("scroll");
  s.style.scrollBehavior = smooth ? "smooth" : "auto";
  s.scrollTop = s.scrollHeight;
}
$("scroll").addEventListener("scroll", () => {
  const s = $("scroll");
  const gap = s.scrollHeight - s.scrollTop - s.clientHeight;
  stickBottom = gap < 80;
  $("btn-jump").hidden = gap < 240;
  $("top").classList.toggle("scrolled", s.scrollTop > 4);
}, { passive: true });
$("btn-jump").onclick = () => { stickBottom = true; scrollToEnd(); };

// Ticking clocks on pending image cards.
setInterval(() => {
  document.querySelectorAll("[data-elapsed]").forEach((el) => {
    el.textContent = Math.floor((Date.now() - +el.dataset.elapsed) / 1000) + "s";
  });
  document.querySelectorAll("[data-progress]").forEach((el) => {
    const f = (Date.now() - +el.dataset.progress) / 1000 / +el.dataset.expect;
    // Eases toward 95% and waits there: a bar that reaches 100% and then
    // sits is worse than one that never claims to know exactly.
    el.style.width = (95 * (1 - Math.exp(-2.2 * f))).toFixed(1) + "%";
  });
}, 500);

// ── thread interactions ─────────────────────────────────────────────────────

$("thread").addEventListener("click", async (ev) => {
  const btn = ev.target.closest("button, img[data-lb]");
  if (!btn) return;
  if (btn.dataset.copy != null) {
    const msgEl = btn.closest(".msg"); const m = current.messages[+msgEl.dataset.i];
    const { blocks } = markdown(m.text || "");
    copy(blocks[+btn.dataset.copy]?.code || ""); btn.textContent = "Copied"; setTimeout(() => btn.textContent = "Copy", 1400);
    return;
  }
  if (btn.dataset.lb) return openLightbox(btn.dataset.lb, btn.dataset.prompt);
  const act = btn.dataset.act; if (!act) return;
  const i = +btn.closest(".msg").dataset.i; const m = current.messages[i];
  haptic();
  if (act === "copy") { copy(plain(m)); toast("Copied"); }
  if (act === "share") shareMsg(m);
  if (act === "speak") speak(plain(m));
  if (act === "again") regenerate(i);
});

function plain(m) {
  if (m.kind === "verdicts") return m.results.map((r) => `${r.verdict.toUpperCase()}: ${r.claim}${r.note ? " — " + r.note : ""}`).join("\n");
  let t = (m.text || "").replace(/<think>[\s\S]*?<\/think>/, "").trim();
  if (m.kind === "answer" && m.sources?.length) t += "\n\nSources:\n" + m.sources.map((u, i) => `${i + 1}. ${u}`).join("\n");
  return t;
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
}
async function shareMsg(m) {
  if (m.kind === "image") return shareImage(m.url, m.prompt);
  const text = plain(m);
  if (NATIVE && native({ type: "shareText", text })) return;
  if (navigator.share) { try { await navigator.share({ text }); } catch {} return; }
  copy(text); toast("Copied");
}

// ── speech ──────────────────────────────────────────────────────────────────

function canSpeak() { return NATIVE || "speechSynthesis" in window; }
function speak(text) {
  const clean = text.replace(/```[\s\S]*?```/g, " (code) ").replace(/[*_#>`|]/g, "").replace(/https?:\/\/\S+/g, "");
  if (NATIVE && native({ type: "speak", text: clean })) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(clean); speechSynthesis.speak(u); } catch {}
}

// Voice input: the Android app's recogniser if present, else Chrome's.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, voiceBase = "";
$("btn-mic").hidden = !(NATIVE || SR);
function setListening(on) {
  listening = on; $("btn-mic").classList.toggle("live", on);
  $("hint").textContent = on ? "Listening… tap the mic to stop" : hintText();
}
window.__sidecarVoice = (ev) => {
  // From the native side: { text, final, error, listening }
  if (ev.error) { setListening(false); if (ev.error !== "cancelled") toast(ev.error); return; }
  if (ev.listening === false) setListening(false);
  if (ev.text != null) { $("input").value = (voiceBase ? voiceBase + " " : "") + ev.text; grow(); updateSend(); }
  if (ev.final) { setListening(false); if (ev.text && settings.autoSendVoice !== false) send(); }
};
$("btn-mic").onclick = () => {
  haptic();
  if (listening) {
    if (NATIVE) native({ type: "stopListening" }); else rec?.stop();
    setListening(false); return;
  }
  voiceBase = $("input").value.trim();
  if (NATIVE) { native({ type: "listen" }); setListening(true); return; }
  rec = new SR(); rec.interimResults = true; rec.lang = navigator.language || "en-GB";
  rec.onresult = (e) => {
    let txt = ""; for (const r of e.results) txt += r[0].transcript;
    window.__sidecarVoice({ text: txt, final: e.results[e.results.length - 1].isFinal });
  };
  rec.onerror = (e) => window.__sidecarVoice({ error: e.error === "no-speech" ? "Didn't catch that" : e.error });
  rec.onend = () => setListening(false);
  try { rec.start(); setListening(true); } catch { toast("Microphone unavailable"); }
};

// ── composer ────────────────────────────────────────────────────────────────

const coarse = matchMedia("(pointer: coarse)").matches;
const input = $("input");
function grow() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, innerHeight * 0.34) + "px"; }
function updateSend() {
  const b = $("btn-send");
  if (busy) {
    b.className = "round stop"; b.disabled = false; b.setAttribute("aria-label", "Stop");
    b.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3" fill="currentColor"/></svg>';
  } else {
    b.className = "round send"; b.disabled = !input.value.trim() && !attached; b.setAttribute("aria-label", "Send");
    b.innerHTML = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
  }
}
input.addEventListener("input", () => { grow(); updateSend(); store.set("sc.draft", input.value); });
input.addEventListener("keydown", (e) => {
  // On a phone, Enter is a new line and the button sends — a chat app that
  // sends half a thought because the keyboard's return key is where your
  // thumb was is a bad chat app. With a real keyboard, Enter sends.
  if (e.key === "Enter" && !e.shiftKey && !coarse && !e.isComposing) { e.preventDefault(); send(); }
});
$("btn-send").onclick = () => busy ? stop() : send();
input.value = store.get("sc.draft", ""); grow();

function hintText() {
  if (settings.mode === "web") return "Searches the web, reads the pages, answers with sources";
  if (settings.mode === "image") {
    const p = currentProfile();
    return p ? `${p.name} · ${p.measured_s ? "~" + Math.round(p.measured_s) + "s" : ""} on your Mac's GPU` : "On your Mac's GPU";
  }
  const l = engineLabel();
  return settings.engine.kind === "local" ? "Private — this conversation never leaves your Mac" : l.sub;
}
function setMode(mode) {
  settings.mode = mode; saveSettings();
  document.querySelectorAll(".mode").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
  input.placeholder = mode === "web" ? "Ask anything current…" : mode === "image" ? "Describe an image…" : "Message";
  $("hint").textContent = hintText();
}
document.querySelectorAll(".mode").forEach((b) => b.onclick = () => {
  haptic();
  if (b.dataset.mode === "image" && settings.mode === "image") return imageSheet();
  setMode(b.dataset.mode);
});

// ── image options ───────────────────────────────────────────────────────────

const ASPECTS = { square: [1024, 1024, "Square"], portrait: [768, 1024, "Portrait"], landscape: [1024, 768, "Landscape"], wide: [1024, 576, "Wide"] };
function currentProfile() {
  const ps = engines?.images?.profiles || [];
  return ps.find((p) => p.name === settings.image.profile) || ps.find((p) => p.name === "standard") || ps[0];
}
function renderImageOpts() {
  const a = ASPECTS[settings.image.aspect] || ASPECTS.square;
  $("image-opts").textContent = settings.mode === "image" ? " · " + a[2].toLowerCase() : "";
}
function imageSheet() {
  const ps = engines?.images?.profiles || [];
  const p = currentProfile();
  let h = `<h2>Image</h2><h3>Shape</h3><div class="seg" id="aspects">` +
    Object.entries(ASPECTS).map(([k, v]) => `<button data-a="${k}" aria-pressed="${settings.image.aspect === k}">${v[2]}</button>`).join("") + `</div><h3>Style</h3>`;
  for (const x of ps) {
    if (x.gated) continue;
    const sub = [x.measured_s ? "~" + Math.round(x.measured_s) + "s" : "", x.supports_negative ? "honours 'avoid'" : "", x.commercial_ok ? "" : "non-commercial"].filter(Boolean).join(" · ");
    h += `<button class="opt" aria-checked="${p && p.name === x.name}" data-p="${esc(x.name)}"><span class="o-ic">${ICON.image}</span><span class="o-tx"><b>${esc(x.name)}</b><small>${esc(sub || (x.note || "").slice(0, 60))}</small></span><span class="check">${ICON.check}</span></button>`;
  }
  if (p?.supports_negative) h += `<h3>Keep out of the picture</h3><input class="field" id="neg" placeholder="e.g. text, watermark" value="${esc(settings.image.negative || "")}">`;
  h += `<p class="note">Generated on your Mac and kept there. One at a time — if something else is painting, yours waits its turn.</p>`;
  $("image-panel").innerHTML = h;
  $("image-panel").querySelectorAll("#aspects button").forEach((b) => b.onclick = () => { settings.image.aspect = b.dataset.a; saveSettings(); renderImageOpts(); imageSheet(); haptic(); });
  $("image-panel").querySelectorAll("[data-p]").forEach((b) => b.onclick = () => { settings.image.profile = b.dataset.p; saveSettings(); imageSheet(); $("hint").textContent = hintText(); haptic(); });
  const neg = $("neg"); if (neg) neg.oninput = () => { settings.image.negative = neg.value; saveSettings(); };
  openSheet("sheet-image");
}

// ── sending ─────────────────────────────────────────────────────────────────

function stop() {
  if (busy) { busy.abort.abort(); haptic("heavy"); }
}

async function send(textOverride) {
  if (busy) return;
  const text = (textOverride ?? input.value).trim();
  if (!text && !attached) return;
  if (!current) newConv();
  const ctx = attached; attached = null; renderAttach();
  current.messages.push({ role: "user", text: text || "Tell me about this.", ctx, mode: settings.mode });
  if (textOverride == null) { input.value = ""; store.set("sc.draft", ""); grow(); }
  stickBottom = true; haptic();
  const mode = settings.mode;
  if (mode === "web") return runAnswer(text);
  if (mode === "image") return runImage(text);
  return runChat();
}

function historyMessages() {
  // Every kind of reply goes back as plain text so a follow-up can refer to
  // a web answer or an image prompt as naturally as to a chat reply.
  const msgs = [];
  if (settings.system.trim()) msgs.push({ role: "system", content: settings.system.trim() });
  for (const m of current.messages) {
    if (m.role === "user") {
      let c = m.text;
      if (m.ctx) c = `${m.ctx.title ? "Title: " + m.ctx.title + "\n" : ""}${m.ctx.url ? "Source: " + m.ctx.url + "\n" : ""}\n"""\n${m.ctx.text.slice(0, 24000)}\n"""\n\n${m.text}`;
      msgs.push({ role: "user", content: c });
    } else if (m.kind === "text" || m.kind === "answer") {
      if (m.text) msgs.push({ role: "assistant", content: plain(m) });
    } else if (m.kind === "image" && m.url) {
      msgs.push({ role: "assistant", content: `[Generated an image of: ${m.prompt}]` });
    } else if (m.kind === "verdicts") {
      msgs.push({ role: "assistant", content: plain(m) });
    }
  }
  return msgs;
}

async function withBusy(kind, fn) {
  const abort = new AbortController();
  busy = { abort, kind }; updateSend();
  try { await fn(abort.signal); }
  catch (e) {
    const last = current.messages[current.messages.length - 1];
    const aborted = e.name === "AbortError";
    if (aborted && last.kind === "text" && last.text) { last.meta = Object.assign(last.meta || {}, { stopped: true }); }
    else {
      const msg = aborted ? "Stopped." : offlineError(e) ? "Couldn't reach your Mac. Check Tailscale and try again." : e.message;
      Object.assign(last, { kind: "error", text: msg });
      if (offlineError(e)) { online = false; renderEngine(); }
    }
  } finally {
    busy = null; updateSend(); render(); persistCurrent();
    haptic();
  }
}
const offlineError = (e) => e instanceof TypeError && /fetch|network|load/i.test(e.message);

async function runChat() {
  const ai = { role: "assistant", kind: "pending", text: "", meta: {} };
  current.messages.push(ai); render();
  const body = Object.assign({ messages: historyMessages(), stream: true, max_tokens: 4096 }, engineRequest());
  const t0 = performance.now();
  await withBusy("chat", async (signal) => {
    const res = await http("/v1/chat/completions", { method: "POST", body: JSON.stringify(body), signal });
    const reader = res.body.getReader(); const dec = new TextDecoder();
    let buf = "";
    ai.kind = "text";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let cut;
      while ((cut = buf.indexOf("\n\n")) >= 0) {
        const frameText = buf.slice(0, cut); buf = buf.slice(cut + 2);
        for (const line of frameText.split("\n")) {
          if (!line.startsWith("data:")) continue;
          const data = line.slice(5).trim();
          if (data === "[DONE]") continue;
          let j; try { j = JSON.parse(data); } catch { continue; }
          if (j.model) ai.meta.model = j.model;
          const d = j.choices?.[0]?.delta?.content;
          if (d) { ai.text += d; renderLast(); }
          if (j.x_sidecar) { ai.meta.cost = j.x_sidecar.cost_usd; ai.meta.local = j.x_sidecar.local; ai.meta.cached = j.x_sidecar.cached; }
        }
      }
    }
    ai.meta.seconds = (performance.now() - t0) / 1000;
    const err = ai.text.match(/\n*\[llm-sidecar error: ([\s\S]*)\]\s*$/);
    if (err) {
      if (ai.text.length - err[0].length < 2) { ai.kind = "error"; ai.text = err[1]; }
      else ai.text = ai.text.slice(0, ai.text.length - err[0].length) + "\n\n> ⚠︎ Stopped early: " + err[1];
    }
    if (!ai.text.trim() && ai.kind === "text") { ai.kind = "error"; ai.text = "The model returned nothing. Try again, or pick another."; }
    if (settings.speakReplies && ai.kind === "text") speak(ai.text);
  });
}

async function runAnswer(question) {
  const ai = { role: "assistant", kind: "pending", status: "Searching the web", meta: {} };
  current.messages.push(ai); render();
  const steps = ["Searching the web", "Reading the pages", "Weighing the sources", "Writing the answer"];
  let s = 0; const tick = setInterval(() => { if (ai.kind === "pending" && s < steps.length - 1) { ai.status = steps[++s]; renderLast(); } }, 4500);
  const t0 = performance.now();
  try {
    await withBusy("web", async (signal) => {
      const a = await postJSON("/v1/answer", { question }, signal);
      Object.assign(ai, { kind: "answer", text: a.text, grounded: a.grounded, sources: a.sources || [], caveat: a.caveat || "",
        meta: { model: a.model, seconds: (performance.now() - t0) / 1000, local: (a.model || "").startsWith("ollama/") } });
      if (settings.speakReplies) speak(a.text);
    });
  } finally { clearInterval(tick); }
}

async function runImage(prompt, seed) {
  const p = currentProfile();
  const [w, h] = ASPECTS[settings.image.aspect] || ASPECTS.square;
  const q = engines?.images || {};
  const ai = { role: "assistant", kind: "image", prompt, started: Date.now(), expect: p?.measured_s || 30, ar: w / h,
    status: q.busy ? "Waiting for the Mac's GPU" : "Painting on your Mac", meta: {} };
  current.messages.push(ai); render();
  await withBusy("image", async (signal) => {
    const body = { prompt, profile: p?.name || "standard", width: w, height: h };
    if (seed != null) body.seed = seed;
    if (p?.supports_negative && settings.image.negative) body.negative = settings.image.negative;
    const r = await postJSON("/app/api/image", body, signal);
    Object.assign(ai, { url: r.url, seed: r.seed, meta: { model: r.model, local: true, seconds: r.seconds } });
  });
}

function regenerate(i) {
  // Drop this reply and resend the turn that produced it.
  const user = current.messages[i - 1];
  if (!user || user.role !== "user") return;
  current.messages.splice(i - 1, 2);
  if (user.share) return shareAction(user.share.kind, user.share.s);
  const prev = settings.mode;
  settings.mode = user.mode || "chat";
  attached = user.ctx || null;
  send(user.text);
  settings.mode = prev;
}

// ── share intake ────────────────────────────────────────────────────────────
// From Chrome's share target (query string) or the Android app
// (window.__sidecarShare). Either way it becomes a card with things to do.

function receiveShare({ title = "", text = "", url = "" } = {}) {
  text = (text || "").trim(); title = (title || "").trim(); url = (url || "").trim();
  if (!url) { const m = text.match(/https?:\/\/\S+/); if (m && text.length - m[0].length < 120) { url = m[0]; text = text.replace(m[0], "").trim(); } }
  if (!text && !url) return;
  shared = { title, text, url };
  if (current?.messages.length) newConv();
  renderShare(); haptic("heavy");
}
window.__sidecarShare = receiveShare;

function renderShare() {
  const slot = $("share-slot");
  if (!shared) { slot.innerHTML = ""; return; }
  const what = shared.url ? (shared.title || hostOf(shared.url)) : shared.text.slice(0, 160);
  slot.innerHTML = `<div class="share-card"><div class="head">${ICON.share}<span>Shared ${shared.url ? "link" : "text"}</span>
      <button class="act" id="share-x" aria-label="Dismiss">${ICON.x}</button></div>
    <div class="what">${esc(what)}${shared.url ? `<br><span style="font-size:12px;color:var(--muted)">${esc(hostOf(shared.url))}</span>` : ""}</div>
    <div class="chips">
      <button class="chip" data-s="summarise">Summarise</button>
      <button class="chip" data-s="ask">Ask about it</button>
      <button class="chip" data-s="factcheck">Fact-check</button>
      <button class="chip" data-s="explain">Explain simply</button>
      ${shared.url ? "" : `<button class="chip" data-s="reply">Draft a reply</button>`}
    </div></div>`;
  $("share-x").onclick = () => { shared = null; renderShare(); };
  slot.querySelectorAll("[data-s]").forEach((b) => b.onclick = () => shareAction(b.dataset.s));
}

async function sharedText(s, signal) {
  if (s.text && !s.url) return s.text;
  const r = await postJSON("/ops/read-url", { url: s.url, max_chars: 24000 }, signal);
  return (s.text ? s.text + "\n\n" : "") + r.text;
}

async function shareAction(kind, again) {
  if (busy) return;
  const s = again || shared; shared = null; renderShare();
  if (!current) newConv();
  const label = s.url ? (s.title || hostOf(s.url)) : "the shared text";
  // Follow-ups to a shared page are questions about it, which is chat (the
  // page travels in the history); Web mode would search afresh instead.
  setMode("chat");
  haptic();
  if (kind === "ask") {
    attached = { title: s.title, url: s.url, text: s.text };
    if (s.url) {
      attached.text = "";
      attached.loading = true; renderAttach();
      try { attached.text = await sharedText(s); attached.loading = false; }
      catch (e) { attached = null; toast("Couldn't read that page: " + e.message); }
    }
    setMode("chat"); renderAttach(); input.focus(); return;
  }
  const verbs = { summarise: "Summarise", factcheck: "Fact-check", explain: "Explain simply", reply: "Draft a reply to" };
  // The share is kept on the message so "try again" redoes the action,
  // rather than sending its label as a chat message.
  current.messages.push({ role: "user", text: `${verbs[kind]} ${s.url ? label : "this"}`, ctx: { title: s.title, url: s.url, text: s.text.slice(0, 2000) }, mode: "chat", share: { kind, s } });
  const ai = { role: "assistant", kind: "pending", status: s.url ? "Reading the page" : "Thinking", meta: {} };
  current.messages.push(ai); render();
  const t0 = performance.now();
  await withBusy("share", async (signal) => {
    const text = await sharedText(s, signal);
    current.messages[current.messages.length - 2].ctx.text = text;
    if (kind === "summarise") {
      ai.status = "Summarising"; renderLast();
      const r = await postJSON("/ops/summarise", { text }, signal);
      Object.assign(ai, { kind: "text", text: r.summary, meta: { seconds: (performance.now() - t0) / 1000 } });
    } else if (kind === "factcheck") {
      ai.status = "Finding the claims and checking each one"; renderLast();
      const r = await postJSON("/ops/fact-check", { text }, signal);
      Object.assign(ai, { kind: "verdicts", results: r.results || [], meta: { seconds: (performance.now() - t0) / 1000 } });
    } else {
      current.messages.pop(); render();
      await runChatInner(signal);
    }
  });
}
// The chat path, reused by share actions that are just a framed prompt.
async function runChatInner(signal) {
  const ai = { role: "assistant", kind: "text", text: "", meta: {} };
  current.messages.push(ai); render();
  const body = Object.assign({ messages: historyMessages(), stream: false, max_tokens: 4096 }, engineRequest());
  const t0 = performance.now();
  const r = await postJSON("/v1/chat/completions", body, signal);
  ai.text = r.choices?.[0]?.message?.content || "";
  ai.meta = { model: r.model, cost: r.x_sidecar?.cost_usd, local: r.x_sidecar?.local, cached: r.x_sidecar?.cached, seconds: (performance.now() - t0) / 1000 };
}

function renderAttach() {
  const slot = $("attach-slot");
  if (!attached) { slot.innerHTML = ""; updateSend(); return; }
  slot.innerHTML = `<div class="attached">${attached.loading ? '<span class="spinner"></span>' : "📎"}<span>${esc(attached.title || (attached.url ? hostOf(attached.url) : attached.text.slice(0, 60)))}</span><button id="attach-x" aria-label="Remove">${ICON.x}</button></div>`;
  $("attach-x").onclick = () => { attached = null; renderAttach(); };
  updateSend();
}

// ── images: lightbox, gallery, save ─────────────────────────────────────────

let lbUrl = "", lbPrompt = "";
function openLightbox(url, prompt) {
  lbUrl = url; lbPrompt = prompt || "";
  $("lb-img").src = imgSrc(url); $("lb-cap").textContent = lbPrompt;
  $("lightbox").classList.add("open"); haptic();
  history.pushState({ lb: 1 }, "");
}
function closeLightbox() { $("lightbox").classList.remove("open"); }
$("lb-close").onclick = () => history.back();
$("lb-save").onclick = () => saveImage(lbUrl);
$("lb-share").onclick = () => shareImage(lbUrl, lbPrompt);
$("lb-remix").onclick = () => {
  history.back(); setMode("image"); if (!current) newConv();
  current.messages.push({ role: "user", text: lbPrompt, mode: "image" });
  runImage(lbPrompt);
};
async function saveImage(url) {
  const full = new URL(imgSrc(url), location.href).href;
  if (NATIVE && native({ type: "saveImage", url: full })) return;
  const a = document.createElement("a"); a.href = full; a.download = url.split("/").pop(); document.body.appendChild(a); a.click(); a.remove();
}
async function shareImage(url, prompt) {
  const full = new URL(imgSrc(url), location.href).href;
  if (NATIVE && native({ type: "shareImage", url: full, text: prompt })) return;
  try {
    const blob = await (await fetch(full)).blob();
    const file = new File([blob], url.split("/").pop(), { type: "image/png" });
    if (navigator.canShare?.({ files: [file] })) return await navigator.share({ files: [file], text: prompt });
  } catch {}
  saveImage(url);
}
async function openGallery() {
  closeSheets(); openSheet("sheet-gallery");
  $("gallery-grid").innerHTML = ""; $("gallery-note").textContent = "Loading…";
  try {
    const g = await getJSON("/app/api/gallery?limit=120");
    $("gallery-grid").innerHTML = g.images.map((x) => `<button data-lb="${esc(x.url)}" data-prompt="${esc(x.prompt)}"><img src="${esc(imgSrc(x.url))}" loading="lazy" alt="${esc(x.prompt)}"></button>`).join("");
    $("gallery-note").textContent = g.images.length ? `${g.images.length} image${g.images.length === 1 ? "" : "s"}, stored on your Mac.` : "Nothing yet. Switch to Image and describe something.";
    $("gallery-grid").querySelectorAll("[data-lb]").forEach((b) => b.onclick = () => openLightbox(b.dataset.lb, b.dataset.prompt));
  } catch (e) { $("gallery-note").textContent = e.message; }
}

// ── sheets, drawer, back button ─────────────────────────────────────────────
// Android's back gesture should close what is open before it leaves the app,
// so every overlay pushes a history entry and popstate closes it.

let openOverlay = null;
function openSheet(id) {
  closeSheets(true);
  $(id).classList.add("open"); $("scrim").classList.add("open"); openOverlay = id;
  history.pushState({ sheet: id }, "");
}
function closeSheets(silent) {
  document.querySelectorAll(".sheet.open, .drawer.open").forEach((s) => s.classList.remove("open"));
  $("scrim").classList.remove("open");
  if (!silent && openOverlay) { openOverlay = null; if (history.state?.sheet || history.state?.drawer) history.back(); }
  openOverlay = null;
}
window.addEventListener("popstate", () => {
  if ($("lightbox").classList.contains("open")) return closeLightbox();
  if (openOverlay) { openOverlay = null; document.querySelectorAll(".sheet.open, .drawer.open").forEach((s) => s.classList.remove("open")); $("scrim").classList.remove("open"); }
});
$("scrim").onclick = () => closeSheets();
$("btn-engine").onclick = () => { haptic(); engineSheet(); openSheet("sheet-engine"); };
$("btn-new").onclick = () => { haptic(); newConv(); input.focus(); };
$("btn-menu").onclick = () => {
  haptic(); renderConvList();
  closeSheets(true); $("drawer").classList.add("open"); $("scrim").classList.add("open"); openOverlay = "drawer";
  history.pushState({ drawer: 1 }, "");
};
$("d-new").onclick = () => { closeSheets(); newConv(); };
$("d-gallery").onclick = () => openGallery();
$("d-settings").onclick = () => { settingsSheet(); };

// Swipe from the left edge opens the drawer; swipe it left to close.
let sx = null, sy = null;
addEventListener("touchstart", (e) => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
addEventListener("touchend", (e) => {
  if (sx == null) return; const t = e.changedTouches[0]; const dx = t.clientX - sx, dy = Math.abs(t.clientY - sy);
  if (sx < 28 && dx > 70 && dy < 60 && !openOverlay) $("btn-menu").click();
  else if (openOverlay === "drawer" && dx < -70 && dy < 60) closeSheets();
  sx = null;
}, { passive: true });

function renderConvList() {
  const day = 864e5, now = Date.now();
  const groups = [["Today", (c) => now - c.at < day], ["This week", (c) => now - c.at < 7 * day], ["Earlier", () => true]];
  const seen = new Set(); let h = "";
  for (const [name, test] of groups) {
    const items = convs.filter((c) => !seen.has(c.id) && test(c));
    if (!items.length) continue;
    h += `<div class="grp">${name}</div>`;
    for (const c of items) {
      seen.add(c.id);
      h += `<div class="conv" role="button" tabindex="0" data-c="${c.id}" aria-current="${current?.id === c.id}"><span>${esc(c.title || "Conversation")}</span><button class="del" data-del="${c.id}" aria-label="Delete">${ICON.trash}</button></div>`;
    }
  }
  $("conv-list").innerHTML = h || `<p class="note" style="padding:8px 12px">Conversations are kept on this phone.</p>`;
  $("conv-list").querySelectorAll("[data-c]").forEach((el) => el.onclick = (e) => {
    if (e.target.closest("[data-del]")) return;
    current = JSON.parse(JSON.stringify(convs.find((c) => c.id === el.dataset.c)));
    stickBottom = true; closeSheets(); render();
  });
  $("conv-list").querySelectorAll("[data-del]").forEach((b) => b.onclick = () => {
    convs = convs.filter((c) => c.id !== b.dataset.del); saveConvs();
    if (current?.id === b.dataset.del) newConv(); else renderConvList();
    haptic(); toast("Deleted");
  });
}

function settingsSheet() {
  const e = engines || {};
  const host = location.hostname;
  let h = `<h2>Settings</h2>
    <h3>Instructions for every chat</h3>
    <textarea class="field" id="set-system" placeholder="e.g. Be brief. I'm on my phone.">${esc(settings.system)}</textarea>
    <h3>Auto's budget</h3>
    <div class="seg" id="set-budget">${[["", "Default"], ["free", "Free"], ["cheap", "Cheap"], ["best", "Best"]].map(([v, l]) => `<button data-v="${v}" aria-pressed="${settings.budget === v}">${l}</button>`).join("")}</div>
    <p class="note">What Auto may spend. Default follows the sidecar (${esc(e.budget || "free")}).</p>
    <h3>Voice</h3>
    <button class="opt" id="set-speak" aria-checked="${settings.speakReplies}"><span class="o-ic">${ICON.speak}</span><span class="o-tx"><b>Read replies aloud</b><small>Hands-free while you walk around</small></span><span class="check">${ICON.check}</span></button>
    <button class="opt" id="set-autosend" aria-checked="${settings.autoSendVoice !== false}"><span class="o-ic">${ICON.check2}</span><span class="o-tx"><b>Send when I stop talking</b><small>Otherwise the text waits for you to edit</small></span><span class="check">${ICON.check}</span></button>
    <h3>Connected to</h3>
    <dl class="kv">
      <dt>Mac</dt><dd class="mono">${esc(host)}</dd>
      <dt>Sidecar</dt><dd>${e.version ? "v" + esc(e.version) : "—"}</dd>
      <dt>Local models</dt><dd>${(e.local || []).length}</dd>
      <dt>Claude</dt><dd>${(e.claude || []).length ? "signed in here" : "off"}</dd>
      <dt>OpenRouter</dt><dd>${e.cloud?.configured ? "key set" : "no key"}</dd>
      <dt>Images</dt><dd>${e.images?.available ? "available" : "not on this Mac"}</dd>
    </dl>
    ${/\.ts\.net$/.test(host) ? `<p class="note">${ICON.lock.replace('width="17" height="17"', 'width="13" height="13" style="display:inline;vertical-align:-2px"')} Private to your Tailscale devices. Nothing here is on the internet.</p>` : ""}
    ${!NATIVE && /Android/i.test(navigator.userAgent) ? `<div class="row-btn"><a class="btn" style="text-align:center;text-decoration:none" href="llmsidecar://connect?url=${encodeURIComponent(location.origin)}">Use in the Android app</a></div>` : ""}
    ${NATIVE ? `<div class="row-btn"><button class="btn" id="set-switch">Connect to a different Mac</button></div>` : ""}
    <div class="row-btn"><button class="btn danger" id="set-clear">Delete all conversations</button></div>`;
  $("settings-panel").innerHTML = h;
  $("set-system").oninput = (ev) => { settings.system = ev.target.value; saveSettings(); };
  $("settings-panel").querySelectorAll("#set-budget button").forEach((b) => b.onclick = () => { settings.budget = b.dataset.v; saveSettings(); settingsSheet(); haptic(); });
  $("set-speak").onclick = () => { settings.speakReplies = !settings.speakReplies; saveSettings(); settingsSheet(); haptic(); };
  $("set-autosend").onclick = () => { settings.autoSendVoice = settings.autoSendVoice === false; saveSettings(); settingsSheet(); haptic(); };
  $("set-switch")?.addEventListener("click", () => native({ type: "reconfigure" }));
  $("set-clear").onclick = () => {
    if (!confirm("Delete every conversation on this phone?")) return;
    convs = []; saveConvs(); newConv(); closeSheets(); toast("All conversations deleted");
  };
  if (!$("sheet-settings").classList.contains("open")) openSheet("sheet-settings");
}

// ── boot ────────────────────────────────────────────────────────────────────

setMode(settings.mode);
renderEngine();
newConv();
connect();
{
  const q = new URLSearchParams(location.search);
  if (q.get("text") || q.get("url")) {
    receiveShare({ title: q.get("title") || "", text: q.get("text") || "", url: q.get("url") || "" });
    history.replaceState(null, "", location.pathname);
  }
}
if ("serviceWorker" in navigator && !NATIVE) {
  navigator.serviceWorker.register("/app/sw.js", { scope: "/app/" }).catch(() => {});
}
</script>
</body>
</html>
