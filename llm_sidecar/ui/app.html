<!doctype html>
<!--
  llm-sidecar on your phone.

  The dashboard (index.html) is for setting the sidecar up at a desk. This is
  for using it away from one: a chat app that talks to whatever this machine
  can reach — its own Ollama models, the Claude subscription signed in here,
  OpenRouter — plus web answers with sources and image generation on the Mac's
  GPU.

  Same rules as the dashboard: one file, no build step, no dependencies, and
  no request to anything but the sidecar itself. A phone page that loaded a
  CDN would tell that CDN every time you opened it, and break the moment the
  CDN was unreachable while your Mac was not.

  Conversations live on the phone (localStorage), not on the Mac. The sidecar
  stays stateless, and a conversation is only ever as visible as the phone
  it was had on.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f6f6f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0e12" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sidecar">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="icon" href="/app/icon-192.png">
<link rel="apple-touch-icon" href="/app/apple-touch-icon.png">
<title>Sidecar</title>
<style>
  :root {
    --bg: #f6f6f9;      --bg2: #ffffff;     --ink: #15161b;    --ink2: #3b3d46;
    --muted: #6d7180;   --faint: #a1a4b0;   --line: #e6e6ec;   --line2: #d9d9e2;
    --accent: #4f46e5;  --accent2: #7c3aed; --on-accent: #fff;
    --tint: #eef0ff;    --tint2: #e3e5ff;
    --ok: #15803d;      --ok-bg: #dcfce7;
    --warn: #a16207;    --warn-bg: #fef3c7;
    --bad: #b91c1c;     --bad-bg: #fee2e2;
    --user: #4f46e5;    --on-user: #fff;
    --code-bg: #f0f1f5; --shadow: 0 6px 30px rgba(20, 20, 50, .10), 0 1px 3px rgba(20,20,50,.06);
    --r: 18px; --r-sm: 12px;
    --top: env(safe-area-inset-top, 0px); --bot: env(safe-area-inset-bottom, 0px);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0e12;      --bg2: #16171d;     --ink: #ecebf2;    --ink2: #c9c9d4;
      --muted: #9a9cab;   --faint: #636674;   --line: #23242d;   --line2: #2e303b;
      --accent: #8b85f7;  --accent2: #b18cff; --on-accent: #0d0e12;
      --tint: #1c1d2b;    --tint2: #262842;
      --ok: #4ade80;      --ok-bg: #11291a;
      --warn: #fbbf24;    --warn-bg: #2f240b;
      --bad: #f87171;     --bad-bg: #351416;
      --user: #5b54ea;    --on-user: #fff;
      --code-bg: #1d1e26; --shadow: 0 10px 40px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    overscroll-behavior: none; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  input, textarea, select { font: inherit; color: inherit; }
  svg { display: block; }
  .mono, code, pre { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace; }
  [hidden] { display: none !important; }

  /* ── shell ─────────────────────────────────────────────────────────── */
  #app { height: 100dvh; display: flex; flex-direction: column; }
  header.top {
    flex: none; display: flex; align-items: center; gap: 4px;
    padding: calc(var(--top) + 6px) 8px 6px; background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: saturate(1.6) blur(14px); -webkit-backdrop-filter: saturate(1.6) blur(14px);
    border-bottom: 1px solid transparent; transition: border-color .2s; z-index: 5;
  }
  header.top.scrolled { border-bottom-color: var(--line); }
  .icon-btn {
    width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center;
    color: var(--ink2); transition: background .15s, transform .1s;
  }
  .icon-btn:active { background: var(--tint); transform: scale(.94); }
  .engine-btn {
    flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center;
    padding: 4px 8px; border-radius: 14px; transition: background .15s;
  }
  .engine-btn:active { background: var(--tint); }
  .engine-btn .name { display: flex; align-items: center; gap: 4px; font-weight: 650; font-size: 16px;
    letter-spacing: -.2px; max-width: 100%; }
  .engine-btn .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .engine-btn .sub { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
  .dot.off { background: var(--bad); }

  main#scroll { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth; overscroll-behavior: contain; }
  #thread { max-width: 760px; margin: 0 auto; padding: 8px 14px 24px; display: flex; flex-direction: column; gap: 18px; }

  /* ── empty state ───────────────────────────────────────────────────── */
  .hero { padding: 7vh 6px 8px; text-align: center; }
  .mark { width: 62px; height: 62px; margin: 0 auto 16px; border-radius: 19px;
    background: linear-gradient(140deg, var(--accent), var(--accent2)); display: grid; place-items: center;
    box-shadow: 0 10px 30px color-mix(in srgb, var(--accent) 35%, transparent); }
  .hero h1 { font-size: 25px; letter-spacing: -.6px; margin: 0 0 6px; font-weight: 700; }
  .hero p { margin: 0 auto; color: var(--muted); font-size: 14.5px; max-width: 330px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 26px 0 6px; text-align: left; }
  .tile { background: var(--bg2); border: 1px solid var(--line); border-radius: var(--r); padding: 13px 14px;
    display: flex; flex-direction: column; gap: 6px; transition: transform .12s, border-color .15s; }
  .tile:active { transform: scale(.98); border-color: var(--accent); }
  .tile .t-ic { width: 30px; height: 30px; border-radius: 9px; background: var(--tint); color: var(--accent);
    display: grid; place-items: center; }
  .tile b { font-size: 14px; font-weight: 620; }
  .tile small { color: var(--muted); font-size: 12.5px; line-height: 1.35; }
  .app-link { margin-top: 14px; font-size: 13px; color: var(--accent); display: inline-flex; gap: 6px; align-items: center; }

  /* ── messages ──────────────────────────────────────────────────────── */
  .msg { display: flex; flex-direction: column; gap: 6px; animation: rise .28s cubic-bezier(.2,.8,.2,1); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .msg.user { align-items: flex-end; }
  .bubble-user {
    background: var(--user); color: var(--on-user); padding: 10px 15px; border-radius: 20px 20px 6px 20px;
    max-width: 86%; white-space: pre-wrap; word-wrap: break-word; font-size: 15.5px;
  }
  .ctx-chip { font-size: 12.5px; color: var(--muted); background: var(--bg2); border: 1px solid var(--line);
    padding: 5px 10px; border-radius: 10px; max-width: 86%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msg.ai .body { font-size: 15.5px; color: var(--ink); word-wrap: break-word; overflow-wrap: anywhere; }
  .body > :first-child { margin-top: 0; }
  .body > :last-child { margin-bottom: 0; }
  .body p { margin: 0 0 .75em; }
  .body h1, .body h2, .body h3 { margin: 1.1em 0 .45em; line-height: 1.3; letter-spacing: -.2px; }
  .body h1 { font-size: 1.25em; } .body h2 { font-size: 1.15em; } .body h3 { font-size: 1.04em; }
  .body ul, .body ol { margin: 0 0 .75em; padding-left: 1.35em; }
  .body li { margin: .22em 0; }
  .body li::marker { color: var(--muted); }
  .body a { color: var(--accent); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
  .body blockquote { margin: 0 0 .75em; padding: 2px 0 2px 12px; border-left: 3px solid var(--line2); color: var(--ink2); }
  .body hr { border: 0; border-top: 1px solid var(--line); margin: 1.1em 0; }
  .body code { background: var(--code-bg); padding: .1em .38em; border-radius: 6px; font-size: .86em; }
  .body .tbl { overflow-x: auto; margin: 0 0 .8em; border: 1px solid var(--line); border-radius: 12px; }
  .body table { border-collapse: collapse; font-size: .9em; min-width: 100%; }
  .body th, .body td { padding: 7px 11px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  .body th { background: var(--code-bg); font-weight: 620; }
  .body tr:last-child td { border-bottom: 0; }
  .codeblock { margin: 0 0 .8em; border-radius: 14px; background: var(--code-bg); border: 1px solid var(--line); overflow: hidden; }
  .codeblock .bar { display: flex; justify-content: space-between; align-items: center; padding: 5px 6px 5px 12px;
    font-size: 11.5px; color: var(--muted); border-bottom: 1px solid var(--line); }
  .codeblock .bar button { padding: 4px 9px; border-radius: 8px; font-size: 11.5px; }
  .codeblock .bar button:active { background: var(--tint2); }
  .codeblock pre { margin: 0; padding: 11px 13px; overflow-x: auto; font-size: 12.8px; line-height: 1.55; }
  .codeblock code { background: none; padding: 0; font-size: inherit; }
  details.think { margin: 0 0 .7em; color: var(--muted); font-size: 13.5px; border-left: 2px solid var(--line2); padding-left: 10px; }
  details.think summary { cursor: pointer; list-style: none; font-weight: 560; }
  details.think summary::before { content: "› "; }
  details.think[open] summary::before { content: "⌄ "; }
  .caret { display: inline-block; width: 8px; height: 1.05em; background: var(--accent); border-radius: 2px;
    vertical-align: -2px; margin-left: 2px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .typing { display: inline-flex; gap: 4px; padding: 8px 0; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); animation: bounce 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: none; opacity: .5; } 30% { transform: translateY(-5px); opacity: 1; } }
  .status-line { color: var(--muted); font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
  .spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line2); border-top-color: var(--accent);
    animation: spin .8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .meta { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; margin-top: 2px; }
  .receipt { font-size: 11.5px; color: var(--faint); display: inline-flex; gap: 6px; align-items: center; margin-right: auto; padding-left: 1px; }
  .receipt .tag { padding: 1px 7px; border-radius: 6px; background: var(--tint); color: var(--accent); font-weight: 560; }
  .receipt .tag.sub { background: color-mix(in srgb, #d97706 14%, transparent); color: #c2410c; }
  .receipt .tag.cloud { background: color-mix(in srgb, #0ea5e9 14%, transparent); color: #0284c7; }
  @media (prefers-color-scheme: dark) {
    .receipt .tag.sub { color: #fdba74; } .receipt .tag.cloud { color: #7dd3fc; }
  }
  .act { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--faint); }
  .act:active { background: var(--tint); color: var(--accent); }

  .err { background: var(--bad-bg); color: var(--bad); padding: 10px 13px; border-radius: 14px; font-size: 14px; }
  .sources { display: flex; gap: 8px; overflow-x: auto; padding: 2px 1px 4px; margin: 2px -14px 0; padding-left: 14px; padding-right: 14px;
    scrollbar-width: none; }
  .sources::-webkit-scrollbar { display: none; }
  .src { flex: none; width: 168px; background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; padding: 9px 11px;
    text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 3px; }
  .src:active { border-color: var(--accent); }
  .src .n { font-size: 11px; color: var(--accent); font-weight: 650; }
  .src .d { font-size: 13px; font-weight: 560; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .src .p { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .verdicts { display: flex; flex-direction: column; gap: 8px; }
  .verdict { background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; font-size: 14.5px; }
  .verdict .v { font-size: 11.5px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase; margin-bottom: 3px; }
  .verdict .v.supported { color: var(--ok); } .verdict .v.contradicted { color: var(--bad); } .verdict .v.unverified { color: var(--warn); }
  .verdict .note { color: var(--muted); font-size: 13px; margin-top: 3px; }

  .imgcard { position: relative; border-radius: 20px; overflow: hidden; background: var(--code-bg); border: 1px solid var(--line);
    max-width: 440px; }
  .imgcard img { width: 100%; display: block; cursor: zoom-in; animation: develop .9s ease; }
  @keyframes develop { from { filter: blur(18px) saturate(.4); opacity: .3; } to { filter: none; opacity: 1; } }
  .imgcard.pending { aspect-ratio: var(--ar, 1); display: grid; place-items: center; }
  .imgcard.pending::before { content: ""; position: absolute; inset: 0;
    background: linear-gradient(110deg, transparent 30%, color-mix(in srgb, var(--accent) 16%, transparent) 50%, transparent 70%);
    background-size: 250% 100%; animation: sweep 1.8s linear infinite; }
  @keyframes sweep { from { background-position: 120% 0; } to { background-position: -120% 0; } }
  .imgcard .pend { position: relative; text-align: center; color: var(--muted); font-size: 13.5px; padding: 20px; }
  .imgcard .pend b { display: block; font-size: 28px; color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 650; letter-spacing: -.5px; }
  .imgcard .bar2 { position: absolute; left: 0; bottom: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 1s linear; }

  /* ── composer ──────────────────────────────────────────────────────── */
  footer.composer-wrap { flex: none; padding: 6px 10px calc(var(--bot) + 10px); background: linear-gradient(to top, var(--bg) 70%, transparent); }
  .composer-inner { max-width: 760px; margin: 0 auto; }
  .modes { display: flex; gap: 6px; margin: 0 0 8px 2px; }
  .mode { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 99px; font-size: 13.5px; font-weight: 560;
    color: var(--muted); background: var(--bg2); border: 1px solid var(--line); transition: all .15s; }
  .mode[aria-pressed="true"] { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
  .mode:active { transform: scale(.96); }
  .mode .opts { opacity: .8; font-weight: 500; }
  .share-card { background: var(--bg2); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; margin: 0 0 8px;
    box-shadow: var(--shadow); animation: rise .25s ease; }
  .share-card .head { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
  .share-card .head button { margin-left: auto; }
  .share-card .what { font-size: 14px; margin: 4px 0 9px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--ink2); }
  .chips { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 7px 12px; border-radius: 99px; background: var(--tint); color: var(--accent); font-size: 13.5px; font-weight: 580; }
  .chip:active { background: var(--tint2); }
  .attached { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--accent); background: var(--tint);
    padding: 5px 6px 5px 10px; border-radius: 10px; margin: 0 0 8px; max-width: 100%; }
  .attached span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .attached button { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; }
  .composer { display: flex; align-items: flex-end; gap: 6px; background: var(--bg2); border: 1px solid var(--line2);
    border-radius: 26px; padding: 5px 5px 5px 16px; box-shadow: var(--shadow); transition: border-color .15s; }
  .composer:focus-within { border-color: color-mix(in srgb, var(--accent) 55%, var(--line2)); }
  .composer textarea { flex: 1; border: 0; outline: 0; background: none; resize: none; max-height: 34vh; min-height: 24px;
    padding: 9px 0; font-size: 16px; line-height: 1.45; }
  .composer textarea::placeholder { color: var(--faint); }
  .round { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; flex: none; transition: transform .1s, background .15s; }
  .round:active { transform: scale(.9); }
  .round.send { background: var(--accent); color: var(--on-accent); }
  .round.send:disabled { background: var(--line2); color: var(--faint); }
  .round.mic { color: var(--muted); }
  .round.mic.live { background: var(--bad); color: #fff; animation: pulse 1.4s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--bad) 55%, transparent); } 100% { box-shadow: 0 0 0 14px transparent; } }
  .round.stop { background: var(--ink); color: var(--bg); }
  .hint-line { text-align: center; font-size: 11.5px; color: var(--faint); margin-top: 7px; min-height: 16px; }
  .jump { position: absolute; left: 50%; transform: translateX(-50%); bottom: 100%; margin-bottom: 8px; width: 38px; height: 38px;
    border-radius: 50%; background: var(--bg2); border: 1px solid var(--line); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--ink2); }
  footer.composer-wrap { position: relative; }

  /* ── sheets ────────────────────────────────────────────────────────── */
  .scrim { position: fixed; inset: 0; background: rgba(5, 5, 15, .38); opacity: 0; pointer-events: none; transition: opacity .22s; z-index: 20; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--bg2); border-radius: 24px 24px 0 0;
    padding: 8px 16px calc(var(--bot) + 18px); max-height: 86dvh; overflow-y: auto; transform: translateY(105%);
    transition: transform .3s cubic-bezier(.2,.85,.25,1); box-shadow: var(--shadow); max-width: 640px; margin: 0 auto; }
  .sheet.open { transform: none; }
  .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line2); margin: 2px auto 12px; }
  .sheet h2 { font-size: 18px; margin: 2px 4px 12px; letter-spacing: -.3px; }
  .sheet h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 18px 4px 8px; font-weight: 650; }
  .opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 11px 12px; border-radius: 14px; }
  .opt:active { background: var(--tint); }
  .opt .o-ic { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; flex: none; background: var(--tint); color: var(--accent); }
  .opt .o-ic.sub { background: color-mix(in srgb, #d97706 14%, transparent); color: #c2410c; }
  .opt .o-ic.cloud { background: color-mix(in srgb, #0ea5e9 14%, transparent); color: #0284c7; }
  .opt .o-tx { flex: 1; min-width: 0; }
  .opt .o-tx b { display: block; font-weight: 600; font-size: 15px; }
  .opt .o-tx small { display: block; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .opt .check { color: var(--accent); opacity: 0; }
  .opt[aria-checked="true"] .check { opacity: 1; }
  .opt[aria-checked="true"] { background: var(--tint); }
  .seg { display: flex; background: var(--bg); border-radius: 12px; padding: 3px; gap: 3px; margin: 0 2px; }
  .seg button { flex: 1; padding: 8px 6px; border-radius: 9px; font-size: 13.5px; font-weight: 560; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--bg2); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  .field { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; outline: 0; font-size: 15px; }
  .field:focus { border-color: var(--accent); }
  textarea.field { resize: vertical; min-height: 84px; }
  .row-btn { display: flex; gap: 8px; margin-top: 12px; }
  .btn { padding: 11px 16px; border-radius: 13px; font-weight: 600; font-size: 14.5px; background: var(--tint); color: var(--accent); flex: 1; }
  .btn.primary { background: var(--accent); color: var(--on-accent); }
  .btn.danger { background: var(--bad-bg); color: var(--bad); }
  .note { color: var(--muted); font-size: 13px; margin: 8px 4px; line-height: 1.5; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13.5px; margin: 0 4px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* drawer */
  .drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(86vw, 340px); background: var(--bg2); z-index: 21;
    transform: translateX(-102%); transition: transform .28s cubic-bezier(.2,.85,.25,1); display: flex; flex-direction: column;
    padding: calc(var(--top) + 12px) 10px calc(var(--bot) + 12px); box-shadow: var(--shadow); }

  .drawer .brand .mark { width: 34px; height: 34px; border-radius: 11px; margin: 0; box-shadow: none; }
  .drawer .brand b { font-size: 17px; letter-spacing: -.3px; }
  .drawer .brand small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
  .drawer .list { flex: 1; overflow-y: auto; margin: 6px -2px; }
  .drawer .grp { font-size: 11.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--faint); padding: 14px 12px 6px; font-weight: 650; }
  .conv { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 10px 12px; border-radius: 12px; font-size: 14.5px; }
  .conv span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv[aria-current="true"] { background: var(--tint); color: var(--accent); font-weight: 580; }
  .conv:active { background: var(--tint); }
  .conv .del { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--faint); opacity: 0; }
  .conv[aria-current="true"] .del { opacity: 1; }
  .drawer .foot { display: flex; flex-direction: column; gap: 2px; border-top: 1px solid var(--line); padding-top: 8px; }
  .drawer .foot .opt { padding: 9px 10px; }
  .drawer .foot .opt .o-ic { width: 32px; height: 32px; border-radius: 10px; }

  /* gallery + lightbox */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin: 0 -8px; }
  .grid button { aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--code-bg); }
  .grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .lightbox { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.94); display: flex; flex-direction: column;
    opacity: 0; pointer-events: none; transition: opacity .2s; }
  .lightbox.open { opacity: 1; pointer-events: auto; }
  .lightbox .lb-img { flex: 1; display: grid; place-items: center; padding: calc(var(--top) + 50px) 8px 8px; min-height: 0; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 10px; object-fit: contain; }
  .lightbox .lb-close { position: absolute; top: calc(var(--top) + 8px); right: 8px; color: #fff; }
  .lightbox .lb-cap { color: #d4d4dc; font-size: 13.5px; padding: 6px 18px; text-align: center; max-height: 22vh; overflow-y: auto; }
  .lightbox .lb-acts { display: flex; justify-content: center; gap: 10px; padding: 8px 12px calc(var(--bot) + 16px); }
  .lightbox .lb-acts button { color: #fff; background: rgba(255,255,255,.12); padding: 10px 16px; border-radius: 14px; font-size: 14px;
    font-weight: 560; display: inline-flex; align-items: center; gap: 7px; }

  .toast { position: fixed; left: 50%; bottom: calc(var(--bot) + 96px); transform: translate(-50%, 20px); background: var(--ink); color: var(--bg);
    padding: 9px 16px; border-radius: 12px; font-size: 14px; font-weight: 560; opacity: 0; transition: all .22s; z-index: 40; pointer-events: none;
    max-width: 88vw; text-align: center; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .offline { margin: 12vh 10px 0; text-align: center; }
  .offline .ic { width: 64px; height: 64px; border-radius: 20px; background: var(--bad-bg); color: var(--bad); display: grid; place-items: center; margin: 0 auto 16px; }
  .offline h2 { margin: 0 0 6px; font-size: 21px; letter-spacing: -.4px; }
  .offline p { color: var(--muted); font-size: 14.5px; max-width: 320px; margin: 0 auto 18px; }

  @media (min-width: 900px) {
    #thread { padding-top: 24px; }
    .tiles { grid-template-columns: repeat(4, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>

    <div><b>Sidecar</b><small id="drawer-host">your Mac</small></div></div>
  <button class="opt" id="d-new"><span class="o-ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span><span class="o-tx"><b>New conversation</b></span></button>

<section class="sheet" id="sheet-engine" aria-label="Choose model"><div class="grab"></div><div id="engine-list"></div></section>

<script>
"use strict";

// ── small utilities ─────────────────────────────────────────────────────────

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const store = {
  // Every access guarded: a private tab or blocked storage throws, and the
  // app must still work — it just forgets on reload.
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

// The Android app adds this to the user agent and a JavaScript channel named
// SidecarNative. Everything native is optional: in Chrome the page uses the
// web equivalent or hides the control.
const NATIVE = typeof window.SidecarNative !== "undefined" || /LLMSidecarApp/.test(navigator.userAgent);
function native(msg) {
  try { window.SidecarNative.postMessage(JSON.stringify(msg)); return true; } catch { return false; }
}
function haptic(kind = "light") {
  if (NATIVE && native({ type: "haptic", kind })) return;
  try { navigator.vibrate && navigator.vibrate(kind === "heavy" ? 18 : 8); } catch {}
}
let toastTimer;
function toast(text) {
  const t = $("toast"); t.textContent = text; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

const ICON = {
  copy: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="3"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>',
  again: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>',
  share: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>',
  speak: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
  check: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg>',
  trash: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>',
  x: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  auto: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 1.9 5.8L20 10l-5 3.8L16.5 20 12 16.6 7.5 20 9 13.8 4 10l6.1-1.2Z"/></svg>',
  mac: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M2 20h20"/></svg>',
  claude: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"/></svg>',
  cloud: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 1 0-1.4-8.8A6 6 0 0 0 4.3 12.6 3.5 3.5 0 0 0 6.5 19Z"/></svg>',
  web: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
  image: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>',
  lock: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  check2: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>',
  off: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l20 20M8.5 16.4a5 5 0 0 1 7 0M5 12.9a10 10 0 0 1 3.2-2M19 12.9a10 10 0 0 0-2.4-1.6M2 9a15 15 0 0 1 4.5-2.9M22 9a15 15 0 0 0-12.4-4M12 20h.01"/></svg>',
};

// ── API ─────────────────────────────────────────────────────────────────────

let token = store.get("sc.token", "");
let tokenWaiters = [];

async function http(path, opts = {}) {
  const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
  if (token) headers.Authorization = "Bearer " + token;
  const res = await fetch(path, Object.assign({}, opts, { headers }));
  if (res.status === 401) {
    await askToken();
    return http(path, opts);
  }
  if (!res.ok) {
    let detail = res.statusText || ("HTTP " + res.status);
    try { const j = await res.json(); detail = j.detail || detail; } catch {}
    const e = new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
    e.status = res.status; throw e;
  }
  return res;
}
const getJSON = async (p) => (await http(p)).json();
const postJSON = async (p, body, signal) => (await http(p, { method: "POST", body: JSON.stringify(body), signal })).json();
const imgSrc = (url) => token ? url + (url.includes("?") ? "&" : "?") + "t=" + encodeURIComponent(token) : url;

function askToken() {
  return new Promise((resolve) => {
    tokenWaiters.push(resolve);
    openSheet("sheet-token");
    setTimeout(() => $("token-in").focus(), 250);
  });
}
$("token-save").onclick = () => {
  token = $("token-in").value.trim();
  store.set("sc.token", token);
  closeSheets();
  tokenWaiters.splice(0).forEach((r) => r());
};

// ── state ───────────────────────────────────────────────────────────────────

let engines = null;           // /app/api/engines
let online = null;
const settings = Object.assign({
  engine: { kind: "auto" },
  mode: "chat",
  system: "",
  budget: "",                  // "" = the sidecar's default
  image: { profile: "standard", aspect: "square" },
  speakReplies: false,
}, store.get("sc.settings", {}));
const saveSettings = () => store.set("sc.settings", settings);

let convs = store.get("sc.convs", []);
let current = null;            // the open conversation
let busy = null;               // { abort, kind }
let attached = null;           // { title, url, text } context for the next message
let shared = null;             // pending share card

const saveConvs = () => {
  // Bounded: localStorage is ~5 MB and a phone keeps it forever.
  convs = convs.slice(0, 80);
  store.set("sc.convs", convs);
};

function newConv() {
  current = { id: uid(), title: "", at: Date.now(), messages: [] };
  attached = null; renderAttach();
  render();
  renderConvList();
}
function persistCurrent() {
  if (!current || !current.messages.length) return;
  current.at = Date.now();
  if (!current.title) {
    const first = current.messages.find((m) => m.role === "user");
    current.title = (first?.text || "Conversation").slice(0, 64);
  }
  convs = [current, ...convs.filter((c) => c.id !== current.id)];
  saveConvs(); renderConvList();
}

// ── engines ─────────────────────────────────────────────────────────────────

const pretty = (id) => {
  if (!id) return "";
  if (id.startsWith("claude/")) return "Claude " + id.slice(7).replace(/^./, (c) => c.toUpperCase());
  if (id.startsWith("ollama/")) return id.slice(7).replace(/:latest$/, "");
  return id.split("/").pop().replace(/:free$/, "");
};
function engineLabel(e = settings.engine) {
  switch (e.kind) {
    case "local":  return { name: pretty(e.model), sub: "on your Mac", cls: "" };
    case "claude": return { name: pretty(e.model), sub: "Claude subscription", cls: "sub" };
    case "cloud":  return { name: "Cloud · " + e.tier, sub: "OpenRouter · " + (e.budget || "free"), cls: "cloud" };
    default:       return { name: "Auto", sub: "the sidecar decides", cls: "" };
  }
}
function engineRequest(e = settings.engine) {
  switch (e.kind) {
