name: Bug report
description: Something behaves differently from how it is documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      placeholder: |
        1. llm-sidecar serve
        2. …
    validations: {required: true}
  - type: textarea
    id: status
    attributes:
      label: Output of `llm-sidecar status`
      description: >
        This reports your OS, Python, which models are reachable, and the
        search provider — most of what's needed to reproduce. It contains no
        key, only whether one is set.
      render: text
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.4.0, or a commit sha"
    validations: {required: true}
