name: Feature request
description: Suggest something the sidecar should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do that you can't?
      description: The problem, rather than a proposed solution — it often has a smaller answer.
    validations: {required: true}
  - type: textarea
    id: idea
    attributes:
      label: What you had in mind (optional)
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: >
        Deliberately out of scope — see the README: embeddings, vector stores,
        cross-session memory, multi-tenant serving, and competing with LiteLLM
        on provider breadth.
      options:
        - label: I've read the README's "Honest limitations" and this isn't already there
