# Publish to PyPI when a version tag is pushed.
#
# Uses PyPI Trusted Publishing (OIDC): GitHub proves the workflow's identity
# to PyPI directly, so there is no API token to create, paste, rotate, or leak.
# That is the point — a long-lived upload token stored in repo secrets is the
# single most stealable thing a small project owns.
#
# One-time setup at https://pypi.org/manage/account/publishing/ :
#   PyPI project name  llm-sidecar
#   Owner              awaistechnologist
#   Repository         llm-sidecar
#   Workflow           publish.yml
#   Environment        pypi
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Only meaningful for a tag push. A manual dispatch has no version in
      # its ref, and should still be able to rehearse the build and the
      # artifact hand-off without being blocked by a comparison that cannot
      # apply.
      - name: Refuse to publish a tag that disagrees with the package
        if: github.event_name == 'push'
        run: |
          python -m pip install --quiet tomli
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomli;print(tomli.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match pyproject version $PKG"
            exit 1
          fi

      # A release that fails its own tests is worse than no release.
      - run: pip install --quiet -e ".[dev]"
      - run: pytest -q

      - run: pip install --quiet build && python -m build
      - run: pip install --quiet twine && twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # Dispatch is a rehearsal: it proves build, upload and download work
    # together, which nothing else exercises because artifacts appear only in
    # this workflow. Actually uploading happens on a tag.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # the OIDC token; nothing else is needed
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # PyPI is not the only place people look. Without this the Releases page
  # stays empty while versions quietly appear on PyPI — which is exactly what
  # happened for 0.5.0 through 0.5.2.
  release:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Notes for this version, from the changelog
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # The section for this version, up to the next "## [" heading.
          awk -v v="## [$VERSION]" '
            index($0, v) == 1 {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No changelog entry for $VERSION." > notes.md
          fi
          echo "Install with: pipx install llm-sidecar" >> notes.md
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
