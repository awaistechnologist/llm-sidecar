# Publish to PyPI when a version tag is pushed.
#
# Uses PyPI Trusted Publishing (OIDC): GitHub proves the workflow's identity
# to PyPI directly, so there is no API token to create, paste, rotate, or leak.
# That is the point — a long-lived upload token stored in repo secrets is the
# single most stealable thing a small project owns.
#
# One-time setup at https://pypi.org/manage/account/publishing/ :
#   PyPI project name  llm-sidecar
#   Owner              awaistechnologist
#   Repository         llm-sidecar
#   Workflow           publish.yml
#   Environment        pypi
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Only meaningful for a tag push. A manual dispatch has no version in
      # its ref, and should still be able to rehearse the build and the
      # artifact hand-off without being blocked by a comparison that cannot
      # apply.
      - name: Refuse to publish a tag that disagrees with the package
        if: github.event_name == 'push'
        run: |
          python -m pip install --quiet tomli
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomli;print(tomli.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match pyproject version $PKG"
            exit 1
          fi

      # A release that fails its own tests is worse than no release.
      - run: pip install --quiet -e ".[dev]"
      - run: pytest -q

      - run: pip install --quiet build && python -m build
      - run: pip install --quiet twine && twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # Dispatch is a rehearsal: it proves build, upload and download work
    # together, which nothing else exercises because artifacts appear only in
    # this workflow. Actually uploading happens on a tag.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # the OIDC token; nothing else is needed
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # PyPI is not the only place people look. Without this the Releases page
  # stays empty while versions quietly appear on PyPI — which is exactly what
  # happened for 0.5.0 through 0.5.2.
  release:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Notes for this version, from the changelog
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # The section for this version, up to the next "## [" heading.
          awk -v v="## [$VERSION]" '
            index($0, v) == 1 {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No changelog entry for $VERSION." > notes.md
          fi
          echo "Install with: pipx install llm-sidecar" >> notes.md
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md

  # Keep the MCP Registry listing in step with PyPI.
  #
  # Without this, server.json pins whatever version was current when someone
  # last ran `mcp-publisher publish` by hand, and the listing silently falls
  # behind — the same staleness that let an MCP tool advertise a profile
  # renamed two releases earlier.
  #
  # Runs after the PyPI publish because the registry verifies the package
  # exists there and carries the `mcp-name` marker in its description.
  registry:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # OIDC; no stored token, same as the PyPI job
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@v7

      - name: Wait for PyPI to actually serve this version
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/llm-sidecar/$V/json" \
                 | grep -q "mcp-name: io.github.awaistechnologist/llm-sidecar"; then
              echo "PyPI serves $V with the ownership marker"; exit 0
            fi
            echo "waiting for PyPI ($i/30)…"; sleep 20
          done
          echo "::error::PyPI never served $V with the mcp-name marker"
          exit 1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Set server.json to the tagged version
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}"
          jq --arg v "$V" '.version = $v | .packages[0].version = $v' \
            server.json > server.tmp && mv server.tmp server.json
          cat server.json

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
