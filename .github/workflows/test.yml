# Run the suite on every push and pull request.
#
# The tests are fully offline — every network path is stubbed — so this needs
# no keys, no services, and no network flakiness budget.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install --quiet -e ".[dev]"
      - run: pytest -q

  # The setup scripts are the first thing a new user runs, and until now they
  # were the only part of the project never executed by anything. Written on a
  # Mac, shipped for Windows, verified by nobody.
  scripts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: install.sh
        if: runner.os != 'Windows'
        run: ./install.sh

      - name: install.bat
        if: runner.os == 'Windows'
        shell: cmd
        run: install.bat

      # Start the daemon, wait for it to answer, then stop it. Proves the
      # script wires up a serving process, not just that it exits 0.
      - name: run.sh serves
        if: runner.os != 'Windows'
        run: |
          ./run.sh --no-ui &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:4001/health && break || sleep 2
          done
          curl -sf http://localhost:4001/health || (echo "daemon never answered" && exit 1)

      - name: run.bat serves
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c run.bat --no-ui" -WindowStyle Hidden
          $ok = $false
          foreach ($i in 1..30) {
            try { Invoke-WebRequest -Uri http://localhost:4001/health -UseBasicParsing | Out-Null; $ok = $true; break }
            catch { Start-Sleep -Seconds 2 }
          }
          if (-not $ok) { throw "daemon never answered" }

  # Build the way the release does, and check the built artefact actually
  # works — not just that it built.
  #
  # 0.9.0 failed to publish because `python -m build` builds the sdist and
  # then builds the wheel from inside it, so a file force-included into the
  # wheel but missing from the sdist is "not found". Building with --wheel
  # goes straight from the source tree and never sees it. Catching that at
  # tag time means a failed release; catching it here means a failed PR.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build sdist and wheel, exactly as the release does
        run: pip install --quiet build && python -m build

      - name: The built wheel must serve its own changelog
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install --quiet dist/*.whl
          cd /tmp && /tmp/v/bin/python -c "
          from llm_sidecar import changes
          r = changes.since('0.1.0')
          assert r['releases'], 'the wheel serves an empty changelog'
          print(f\"changelog ships: {len(r['releases'])} releases\")
          "
